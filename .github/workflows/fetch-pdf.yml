name: Fetch source PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download public source PDF
        run: |
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1qfKO4iBOAdLXaE0p9Fj0CPdCjaImde3q&export=download&confirm=t' \
            -o source.pdf
          file source.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source.pdf')
          data = p.read_bytes()
          assert data.startswith(b'%PDF-'), f'Not a PDF: {data[:100]!r}'
          print(f'Validated PDF signature; size={len(data)} bytes')
          PY
      - name: Upload source PDF
        uses: actions/upload-artifact@v4
        with:
          name: source-pdf
          path: source.pdf
          retention-days: 1
