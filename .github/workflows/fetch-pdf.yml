name: Fetch source PDF

on:
  push:
    branches:
      - arena/f4119213-amn-malomat
    paths:
      - .github/workflows/fetch-pdf.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: arena/f4119213-amn-malomat
      - name: Download public source PDF
        run: |
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1qfKO4iBOAdLXaE0p9Fj0CPdCjaImde3q&export=download&confirm=t' \
            -o source.pdf
          file source.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source.pdf')
          data = p.read_bytes()
          assert data.startswith(b'%PDF-'), f'Not a PDF: {data[:100]!r}'
          print(f'Validated PDF signature; size={len(data)} bytes')
          PY
      - name: Commit source PDF to the task branch
        run: |
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@users.noreply.github.com'
          git add source.pdf
          git commit -m 'Add source PDF for text extraction'
          git push origin "HEAD:${GITHUB_REF_NAME}"
